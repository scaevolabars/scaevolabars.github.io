{{- /* Hugo 0.166's embedded table hook, wrapped so a wide table scrolls and the keyboard can reach it. */ -}}
<div class="table-scroll" role="region" tabindex="0" aria-label="Table">
<table
	{{- range $k, $v := .Attributes }}
		{{- if $v }}
		{{- printf " %s=%q" $k ($v | transform.HTMLEscape) | safeHTMLAttr }}
		{{- end }}
	{{- end }}>
	<thead>
		{{- range .THead }}
			<tr>
				{{- range . }}
					<th
						{{- with .Alignment }}
						{{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
						{{- end -}}>
						{{- .Text -}}
					</th>
				{{- end }}
			</tr>
		{{- end }}
	</thead>
	<tbody>
		{{- range .TBody }}
			<tr>
				{{- range . }}
					<td
						{{- with .Alignment }}
						{{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
						{{- end -}}>
						{{- .Text -}}
					</td>
				{{- end }}
			</tr>
		{{- end }}
	</tbody>
</table>
</div>
